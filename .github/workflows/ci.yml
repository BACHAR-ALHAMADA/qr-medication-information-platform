name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up .NET SDK 8
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Select installed .NET SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}" --roll-forward disable
      - name: Restore backend
        run: dotnet restore MedicationInformationPlatform.sln --source https://api.nuget.org/v3/index.json
      - name: Build backend
        run: dotnet build MedicationInformationPlatform.sln --configuration Release --no-restore
      - name: Test backend
        run: dotnet test MedicationInformationPlatform.sln --configuration Release --no-build --no-restore --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm exec --no -- tsc --noEmit
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test
