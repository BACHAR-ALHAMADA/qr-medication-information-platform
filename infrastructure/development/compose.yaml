# Local development only; no application service or schema bootstrap.
name: qr-medication-dev
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the local .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set a development admin user in the local .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development admin password in the local .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  postgres_data:
